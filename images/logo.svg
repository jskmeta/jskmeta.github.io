<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <!-- Highlight gold -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db" />
      <stop offset="40%" stop-color="#f0cb75" />
      <stop offset="80%" stop-color="#cf9e38" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>

    <!-- Midtone gold -->
    <linearGradient id="gold-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d688" />
      <stop offset="50%" stop-color="#d4a343" />
      <stop offset="100%" stop-color="#8c5e14" />
    </linearGradient>

    <!-- Deep shadow facet -->
    <linearGradient id="gold-shadow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b08226" />
      <stop offset="50%" stop-color="#7a500e" />
      <stop offset="100%" stop-color="#4d3005" />
    </linearGradient>

    <!-- Horizontal sweep -->
    <linearGradient id="gold-sweep" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fae2a0" />
      <stop offset="50%" stop-color="#d8ab4e" />
      <stop offset="100%" stop-color="#9b6e1c" />
    </linearGradient>

    <filter id="subtle-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#subtle-drop)">
    <!-- J STEM (Left facet light, Right facet shadow) -->
    <!-- Top terminal cap -->
    <polygon points="120,95 195,95 195,135 158,135 158,300 120,300" fill="url(#gold-light)" />
    
    <!-- J Hook (Bottom curve) -->
    <path d="M 120,300 L 158,300 C 158,335 140,365 105,365 C 75,365 55,345 55,315 L 90,315 C 90,328 96,335 105,335 C 114,335 120,325 120,300 Z" fill="url(#gold-mid)" />

    <!-- S LETTER (Intertwined center ribbon with over/under layering) -->
    <!-- S Top Arc (Over the J) -->
    <path d="M 290,175 C 290,125 240,95 185,95 L 185,135 C 220,135 250,150 250,175 C 250,205 220,225 180,245 C 130,270 100,305 100,355 C 100,410 150,440 215,440 C 275,440 310,410 310,360 L 268,360 C 268,388 245,402 215,402 C 175,402 142,382 142,355 C 142,328 165,310 205,290 C 260,262 290,230 290,175 Z" fill="url(#gold-light)" />

    <!-- Negative space cut / shadow on S spine where it weaves -->
    <path d="M 180,245 C 220,225 250,205 250,175 C 250,165 245,155 235,148 L 245,135 C 260,145 268,160 268,175 C 268,215 235,240 195,258 Z" fill="url(#gold-shadow)" opacity="0.8" />

    <!-- K LETTER (Right side with bold angled facets) -->
    <!-- K Vertical Stem -->
    <polygon points="325,120 365,120 365,415 325,415" fill="url(#gold-mid)" />
    <polygon points="325,120 345,120 345,415 325,415" fill="url(#gold-light)" />

    <!-- K Upper Diagonal (with chiseled split) -->
    <polygon points="365,260 440,140 485,140 395,280" fill="url(#gold-light)" />
    <polygon points="365,260 395,280 470,165 440,140" fill="url(#gold-shadow)" opacity="0.6" />

    <!-- K Lower Diagonal (with chiseled split) -->
    <polygon points="375,250 485,415 440,415 350,285" fill="url(#gold-mid)" />
    <polygon points="375,250 350,285 415,385 440,415" fill="url(#gold-light)" />
  </g>
</svg>
